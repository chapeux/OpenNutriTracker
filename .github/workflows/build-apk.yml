name: Build APK

on:
  workflow_dispatch: # Permite disparar manualmente na aba Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies and generate l10n
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: opennutritracker-pt-apk
          path: build/app/outputs/flutter-apk/app-release.apk
